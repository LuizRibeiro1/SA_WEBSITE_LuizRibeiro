        <h2>Portfólio – Nossa História</h2>
        <img
          src="https://images.squarespace-cdn.com/content/v1/60044269c8cd610112a58df8/1615503411063-6RDNGOUF7Q7M6YP6SNGN/pixelForge_logo_landscape.png "
          alt=" " width="400" height="300px" ;>

        <figcaption>A PixelForge nasceu da paixão de três amigos universitários por jogos e arte digital.
          <p> </p>
          Em um pequeno estúdio improvisado, eles começaram a transformar ideias criativas em protótipos jogáveis,
          explorando mundos pixelados e mecânicas inovadoras.
          <p></p>
          O nome PixelForge surgiu da fusão entre o universo dos pixels que representa a estética retrô e a liberdade
          visual dos jogos indie
          e a forja, símbolo da criação artesanal e da dedicação em cada projeto.


        </figcaption>

        <h2>Como criamos os jogos</h2>

        <img src="https://t0ggles.com/assets/demo/boards/pixelforge-games/pixelforge-games-logo.png" alt=""
          width="400px" height="300px" ;>

        <figcaption>Tudo começa com uma ideia simples — uma fagulha. Essa fagulha nasce em conversas entre amigos, em
          rabiscos de caderno ou até em sonhos malucos que parecem impossíveis.
          <p></p>
          A partir daí, mergulhamos em protótipos, testamos mecânicas e deixamos que a comunidade nos inspire. Nosso
          processo é artesanal: cada detalhe é pensado, cada personagem é moldado como se fosse uma escultura digital.
        </figcaption>

        <h2>A História do Pixel Forge 3D</h2>
        <img src="https://www.pixelforge3d.co.uk/uploads/b/e828e5c0-2623-11f0-a5ac-a94c896b13a4/Pixelforge%20logo.PNG"
          alt="" width="400px" height="300px" ;>

        <figcaption>No início, o Pixel Forge 3D nasceu como um sonho de jovens desenvolvedores independentes que queriam
          unir duas paixões: a estética retrô dos jogos pixelados e o poder da criação em três dimensões.<p></p>
          A ideia era simples, mas ambiciosa: criar um universo onde qualquer jogador pudesse não apenas jogar, mas
          também forjar seus próprios mundos.</figcaption>
